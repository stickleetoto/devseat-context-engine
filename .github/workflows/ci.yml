name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev,tokenizers]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Fact benchmark smoke test
        run: python -m devseat_context.fact_benchmark
      - name: Evidence quality benchmark smoke test
        run: python -m devseat_context.quality_benchmark
      - name: Risk preservation benchmark smoke test
        run: python -m devseat_context.risk_benchmark
      - name: Integrity contract benchmark smoke test
        run: python -m devseat_context.integrity_benchmark --count 150 --seed 8042
      - name: Group-disjoint CPU ranker development benchmark
        run: python -m devseat_context.ranker_benchmark
      - name: Explicitly approved synthetic agent replay smoke
        run: python -m devseat_context.agent_replay --suite benchmarks/replay_synthetic.json

  cpu-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: CPU fast-path benchmark (no absolute latency threshold)
        run: python -m devseat_context.perf_benchmark --sizes 250 1000 10000 50000 --repetitions 3 --legacy-max 250
      - name: CPU lexical hotspot profiler smoke
        run: python -m devseat_context.perf_profile --segments 1000 --top 12
      - name: Learned CPU ranker overhead smoke
        run: python -m devseat_context.ranker_perf --sizes 1000 10000 --repetitions 3
