[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devseat-context-engine"
version = "0.9.1"
description = "CPU-first, provenance-aware extractive context compression"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
tokenizers = ["tiktoken>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep safety and correctness checks strict; formatting/import rules are a separate migration.
select = ["E4", "E7", "E9", "F"]
